name = "weekly-planner-heartbeat"
main = "src/index.js"
compatibility_date = "2026-09-23"

# Once a day is enough — nothing reads the response. This exists solely to
# keep the free-tier Supabase project out of its ~7-day idle pause, which has
# to be restored by hand from the dashboard if it's ever allowed to trigger.
# See the "Ask the user before starting" / Phase 4 notes in the sync plan.
[triggers]
crons = ["0 12 * * *"]

# SUPABASE_URL and SUPABASE_ANON_KEY are set with `wrangler secret put`
# rather than committed here — not because the anon key is sensitive (it
# isn't; RLS is what protects the data), just to keep project config out of
# git by the same convention the app's own `.env` follows.
