[package]
name = "weekly-planner"
version = "1.0.0"
description = "A weekly student planner"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "weekly_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }

# Already pulled in by tauri's macOS backend; declared here so the window-drag
# command can call AppKit directly. Versions pinned to what the lockfile holds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSWindow", "NSResponder", "NSGraphicsContext", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSData", "NSArray", "NSDictionary", "NSString", "NSError"] }
# Apple's Vision framework, for on-device text recognition in screenshot
# import, and PDFKit to rasterise PDF pages so they can go through the same path.
objc2-vision = "0.3"
objc2-pdf-kit = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
