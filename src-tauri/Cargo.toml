[package]
name = "weekly-planner"
version = "1.0.0"
description = "A weekly student planner"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "weekly_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Already pulled in by tauri's macOS backend; declared here so the window-drag
# command can call AppKit directly. Versions pinned to what the lockfile holds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSWindow", "NSResponder", "NSGraphicsContext"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
